name: 隐私与密钥自检

# 说明：
# - 个人主页，纯静态，无部署流程；本工作流只做检查。
# - 检查失败不阻断推送（未配 required status check），仅提醒。
# - 目的：防止手机号 / 身份证 / 密钥被提交进这个公开仓库。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 扫描手机号 / 身份证 / 密钥
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描当前文件（隐私号码）
        run: |
          echo "::group::手机号与身份证号扫描"
          HITS=$(grep -rInP '(?<![0-9.])1[3-9][0-9]{9}(?![0-9])' \
            --include='*.html' --include='*.js' --include='*.json' --include='*.md' \
            --include='*.css' --include='*.yml' --include='*.txt' \
            --exclude-dir=.git . 2>/dev/null || true)
          IDHITS=$(grep -rInP '(?<![0-9])[0-9]{17}[0-9Xx](?![0-9A-Za-z])' \
            --include='*.html' --include='*.js' --include='*.json' --include='*.md' \
            --exclude-dir=.git . 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::warning::发现疑似手机号"
            echo "$HITS" | sed -E 's/1[3-9][0-9]{9}/***号码***/g' | head -20
          else
            echo "✓ 无手机号命中"
          fi

          if [ -n "$IDHITS" ]; then
            echo "::warning::发现疑似身份证号"
            echo "$IDHITS" | sed -E 's/[0-9]{17}[0-9Xx]/***身份证***/g' | head -10
          else
            echo "✓ 无身份证命中"
          fi
          echo "::endgroup::"
          exit 0

      - name: 扫描当前文件（密钥）
        run: |
          echo "::group::令牌 / API Key / 私钥扫描"
          SEC=$(grep -rInE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            --include='*.html' --include='*.js' --include='*.json' \
            --include='*.yml' --include='*.yaml' --include='*.txt' --include='*.ps1' --include='*.sh' \
            --exclude-dir=.git . 2>/dev/null || true)

          if [ -n "$SEC" ]; then
            echo "::error::发现疑似密钥泄露！请立刻去对应平台撤销该密钥，删文件不等于安全"
            echo "$SEC" | cut -d: -f1,2 | head -20
            exit 1
          else
            echo "✓ 无密钥命中"
          fi
          echo "::endgroup::"

      - name: 检查照片版权风险（仅提示）
        continue-on-error: true
        run: |
          echo "::group::图片资源清点（人工确认版权）"
          echo "站内图片文件："
          find . -type f \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' \) -not -path './.git/*' | head -40
          echo "提醒：以上图片应为本人拍摄或本人所有，第三方素材须确认授权。"
          echo "::endgroup::"

      - name: 汇总
        run: |
          echo "检查完成。当前文件隐私号码与密钥均已扫描。"
          echo "本工作流不阻断推送，发现问题请手动修正后重新提交。"
